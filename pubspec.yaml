name: miila_app
description: "Miila — ayollar sog'ligi va sikl kuzatuv ilovasi (Porla backend API bilan ulangan, Figma dizayni asosida)"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  google_fonts: ^6.2.1
  intl: ^0.19.0
  http: ^1.2.2
  shared_preferences: ^2.3.3
  provider: ^6.1.2
  video_player: ^2.9.2
  url_launcher: ^6.3.1
  google_sign_in: ^6.2.1
  flutter_svg: ^2.0.10

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
